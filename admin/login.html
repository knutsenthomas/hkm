            <!-- Theme Initializer -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('hkm_theme');
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            function applyTheme(theme) {
                const active = theme || (mq.matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', active);
            }
            applyTheme(savedTheme);
            if (!savedTheme) {
                try {
                    mq.addEventListener('change', function () {
                        if (!localStorage.getItem('hkm_theme')) {
                            applyTheme();
                        }
                    });
                } catch (err) {
                    try {
                        mq.addListener(function () {
                            if (!localStorage.getItem('hkm_theme')) {
                                applyTheme();
                            }
                        });
                    } catch (e2) {}
                }
            }
        })();
    </script>

    <script type="module">
        (function () {
            if (!('serviceWorker' in navigator)) return;
            const hostname = window.location.hostname;
            const isLocalDev = hostname === 'localhost' || hostname === '127.0.0.1';
            if (!isLocalDev) return;

            window.addEventListener('load', async () => {
                try {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.allSettled(regs.map((reg) => reg.unregister()));
                    if (window.caches && typeof caches.keys === 'function') {
                        const keys = await caches.keys();
                        await Promise.allSettled(
                            keys.filter((key) => key.startsWith('hkm-admin-')).map((key) => caches.delete(key))
                        );
                    }
                    console.info('[HKM] Local admin service workers/caches cleared');
                } catch (err) {
                    console.warn('[HKM] Could not clear local admin service worker cache:', err);
                }
            });
        })();
    </script>

    <!-- Auth Logic -->
    <script type="module">
            (async function () {
                console.log("[HKM] Admin Auth Script loaded");

                // Admin requires a session completed with a second factor.
                let routing = null;
                function routeByRole() {
                    // Sign-in handlers and the auth listener may both call this; run the second-factor step once.
                    routing ||= routeByRoleOnce().finally(() => { routing = null; });
                    return routing;
                }
                async function routeByRoleOnce() {
                    const twoFactor = window.HKMSecondFactor;
                    if (!twoFactor) { showError('Sikkerhetsmodulen kunne ikke lastes. Last siden på nytt.'); return; }
                    try {
                        await twoFactor.completeSecondFactor(firebase.auth());
                    } catch (error) {
                        await firebase.auth().signOut().catch(() => {});
                        if (error instanceof twoFactor.SignInAgainRequired) showInfo('Tofaktor er klar. Logg inn på nytt og bekreft med koden din.');
                        else if (error?.code !== 'auth/popup-closed-by-user') showError(twoFactor.messageFor(error));
                        return;
                    }
                    return routeByRoleAfterSecondFactor();
                }

                async function signInWithChallenge(error) {
                    if (!window.HKMSecondFactor?.isChallenge(error)) return false;
                    try {
                        await window.HKMSecondFactor.resolveChallenge(firebase.auth(), error);
                        await routeByRole();
                    } catch (err) {
                        await firebase.auth().signOut().catch(() => {});
                        if (err?.code !== 'auth/popup-closed-by-user') showError(window.HKMSecondFactor.messageFor(err));
                    }
                    return true;
                }

                async function routeByRoleAfterSecondFactor() {
                    const service = window.firebaseService;
                    const user = firebase.auth().currentUser;
                    if (!user || !service) {
                        window.location.href = '/admin/index.html';
                        return;
                    }

                    let role = 'medlem';
                    let roleLookupFailed = false;
                    try {
                        role = await service.getUserRole(user.uid, { timeoutMs: 2500 });
                    } catch (err) {
                        roleLookupFailed = true;
                        console.warn('Kunne ikke hente rolle:', err);
                        if (typeof showToast === 'function') {
                            showToast('Innlogging er OK, men rolleverifisering er treg. Åpner admin og prøver igjen der.', 'warning', 4500);
                        }
                    }

                    if (roleLookupFailed) {
                        // Let admin dashboard perform the final RBAC check to avoid false "medlem" redirects on slow Firestore.
                        window.location.href = '/admin/index.html';
                        return;
                    }

                    const adminUtils = window.HKMAdminUtils || {};
                    const canAccessAdmin = typeof adminUtils.isElevatedAdminRole === 'function'
                        ? adminUtils.isElevatedAdminRole(role)
                        : ['admin', 'superadmin'].includes(String(role || '').toLowerCase());

                    if (!canAccessAdmin && typeof adminUtils.pushFlashNotice === 'function') {
                        adminUtils.pushFlashNotice('Access Denied: Du har ikke administratorrettigheter til adminpanelet.', 'error', 6000);
                    }

                    const params = new URLSearchParams(window.location.search);
                    const oauthRequest = params.get('aiOAuth');
                    const reviewId = params.get('aiReview');
                    let adminDestination = '/admin/index.html';
                    if (/^[a-zA-Z0-9]{20}$/.test(oauthRequest || '')) {
                        adminDestination = `/admin/admin-nyhetsbrev?aiOAuth=${oauthRequest}`;
                    } else if (/^[a-zA-Z0-9]{20}$/.test(reviewId || '')) {
                        adminDestination = `/admin/admin-nyhetsbrev?aiReview=${reviewId}`;
                    }
                    window.location.href = canAccessAdmin ? adminDestination : '/minside/index.html';
                }

                const errorBox = document.getElementById('error-box');
                const infoBox = document.getElementById('info-box');
                const showError = (msg) => { if (infoBox) infoBox.style.display = 'none'; if (errorBox) { errorBox.textContent = msg; errorBox.style.display = 'block'; } };
                const showInfo = (msg) => { if (errorBox) errorBox.style.display = 'none'; if (infoBox) { infoBox.textContent = msg; infoBox.style.display = 'block'; } };
                if (new URLSearchParams(window.location.search).get('reason') === '2fa') showInfo('Tofaktor er nå påkrevd for alle kontoer. Logg inn igjen for å sette det opp.');

                const loginForm = document.getElementById('login-form');
                if (loginForm) {
                    loginForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const email = document.getElementById('email').value.trim();
                        const btn = loginForm.querySelector('button[type="submit"]');
                        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                            showError('Skriv inn en gyldig e-postadresse.');
                            return;
                        }
                        const service = window.firebaseService;
                        if (!service || !service.isInitialized) {
                            showError('Tjenesten er ikke helt klar. Prøv igjen om et sekund.');
                            return;
                        }
                        const originalText = btn.textContent;
                        btn.textContent = 'Sender lenke...';
                        btn.disabled = true;
                        try {
                            // Keep the admin deep link (for example ?aiOAuth=) when the link is opened.
                            await firebase.auth().sendSignInLinkToEmail(email, { url: window.location.href, handleCodeInApp: true });
                            try { localStorage.setItem('emailForSignIn', email); } catch (err) {}
                            showInfo(`Vi har sendt en innloggingslenke til ${email}. Åpne den på denne enheten.`);
                            btn.textContent = 'Send ny lenke';
                        } catch (err) {
                            console.error('[HKM] Email link error:', err);
                            showError(err.code === 'auth/invalid-email' ? 'Skriv inn en gyldig e-postadresse.' : 'Kunne ikke sende innloggingslenke. Prøv igjen.');
                            btn.textContent = originalText;
                        } finally {
                            btn.disabled = false;
                        }
                    });
                }

                // Complete sign-in when the page is opened from the emailed link.
                if (typeof firebase !== 'undefined' && firebase.auth().isSignInWithEmailLink(window.location.href)) {
                    let email = null;
                    try { email = localStorage.getItem('emailForSignIn'); } catch (err) {}
                    if (!email) email = window.prompt('Bekreft e-postadressen din for å fullføre innloggingen:');
                    if (email) {
                        try {
                            await firebase.auth().signInWithEmailLink(email, window.location.href);
                            try { localStorage.removeItem('emailForSignIn'); } catch (err) {}
                            const clean = new URL(window.location.href);
                            ['apiKey', 'oobCode', 'mode', 'lang', 'continueUrl'].forEach(key => clean.searchParams.delete(key));
                            history.replaceState(null, '', clean.pathname + clean.search);
                        } catch (err) {
                            if (await signInWithChallenge(err)) return;
                            console.error('[HKM] Email link sign-in failed:', err);
                            showError(['auth/invalid-action-code', 'auth/expired-action-code'].includes(err.code)
                                ? 'Innloggingslenken er utløpt eller allerede brukt. Be om en ny lenke.'
                                : 'Kunne ikke fullføre innloggingen. Be om en ny lenke.');
                        }
                    }
                }

                const appleBtn = document.getElementById('apple-login');
                if (appleBtn) {
                    appleBtn.addEventListener('click', async () => {
                        const original = appleBtn.innerHTML;
                        appleBtn.disabled = true;
                        appleBtn.textContent = 'Logger inn...';
                        try {
                            const provider = new firebase.auth.OAuthProvider('apple.com');
                            provider.addScope('email');
                            provider.addScope('name');
                            await firebase.auth().signInWithPopup(provider);
                            await routeByRole();
                        } catch (err) {
                            if (await signInWithChallenge(err)) return;
                            console.error('[HKM] Apple login error:', err);
                            if (err.code !== 'auth/popup-closed-by-user') showError('Kunne ikke logge inn med Apple. Prøv igjen.');
                        } finally {
                            appleBtn.disabled = false;
                            appleBtn.innerHTML = original;
                        }
                    });
                }

                const googleBtn = document.getElementById('google-login');
                if (googleBtn) {
                    googleBtn.addEventListener('click', async () => {
                        const adminUtils = window.HKMAdminUtils || {};
                        const service = window.firebaseService;
                        if (!service || !service.isInitialized) {
                            showToast("Tjenesten er ikke klar!", "error");
                            return;
                        }

                        const loginFlow = async () => {
                            try {
                                await service.loginWithGoogle({ preferPopup: true, redirectFallback: true });
                                await routeByRole();
                            } catch (err) {
                                 if (await signInWithChallenge(err)) return;
                                 console.error("[HKM] Google login error:", err);
                                 if (typeof showToast === 'function') {
                                     let msg = 'Kunne ikke logge inn med Google. Prøv igjen.';
                                     if (err.code === 'auth/unauthorized-domain') {
                                         const host = window.location.hostname;
                                         msg = `Domenet (${host}) er ikke godkjent for Google-innlogging i Firebase Authentication.`;
                                         if (host === '127.0.0.1') {
                                             msg += ' Prøv å åpne siden med localhost i stedet for 127.0.0.1. Hvis feilen fortsetter, må domenet legges til under Authorized Domains i Firebase Console.';
                                         } else {
                                             msg += ' Legg domenet til under Authorized Domains i Firebase Console.';
                                         }
                                     } else if (err.code === 'auth/popup-closed-by-user') {
                                         msg = 'Innloggingsvinduet ble lukket før fullføring.';
                                     }
                                     showToast(msg, 'error', 7000);
                                 }
                            }
                        };

                        if (typeof adminUtils.withButtonLoading === 'function') {
                            await adminUtils.withButtonLoading(googleBtn, loginFlow, { loadingText: 'Logger inn...' });
                        } else {
                            const originalText = googleBtn.innerHTML;
                            googleBtn.disabled = true;
                            googleBtn.innerHTML = 'Logger inn...';
                            try {
                                await loginFlow();
                            } finally {
                                googleBtn.disabled = false;
                                googleBtn.innerHTML = originalText;
                            }
                        }
                    });
                }

                // On mobile, Google sign-in returns by redirect; enrolled accounts are asked for their code here.
                if (typeof firebase !== 'undefined') {
                    firebase.auth().getRedirectResult().catch(err => signInWithChallenge(err));
                }

                // Auto-redirect if already logged in globally
                if (typeof firebase !== 'undefined') {
                    firebase.auth().onAuthStateChanged(async (user) => {
                        if (user) {
                            console.log("[HKM] Already logged in globally, routing...");
                            let count = 0;
                            while ((!window.firebaseService || !window.firebaseService.isInitialized) && count < 100) {
                                await new Promise(r => setTimeout(r, 50));
                                count++;
                            }
                            await routeByRole();
                        }
                    });
                }
            })();
    </script>
